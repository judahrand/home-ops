---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mikrotik-manager-valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mikrotik-manager-valkey
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mikrotik-manager
              app.kubernetes.io/controller: backend
      ports:
        - port: 6379
