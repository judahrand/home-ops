---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: mikrotik-manager
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: MikroTik Manager
  origin: https://mikrotik-manager.judahrand.net/
  redirectUrl:
    - https://mikrotik-manager.judahrand.net/api/auth/oidc/callback
  strictRedirectUrl: true
  scopeMap:
    - group: mikrotik_manager_admins@auth.judahrand.net
      scopes: [openid, profile, email]
  claimMap:
    - name: mikrotik_manager_roles
      joinStrategy: array
      valuesMap:
        - group: mikrotik_manager_admins@auth.judahrand.net
          values: [admin]
  preferShortUsername: true
  disableConsentPrompt: true
