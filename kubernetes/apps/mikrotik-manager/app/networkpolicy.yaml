---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mikrotik-manager-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mikrotik-manager
      app.kubernetes.io/controller: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mikrotik-manager
              app.kubernetes.io/controller: nginx
      ports:
        - port: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mikrotik-manager-nginx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mikrotik-manager
      app.kubernetes.io/controller: nginx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - port: 80
