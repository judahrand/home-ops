---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./multinetworkpolicy.yaml
  - ./networkpolicy.yaml
patches:
  - patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: ${APP}
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
