---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mikrotik-manager-database
spec:
  targetNamespace: mikrotik-manager
  components:
    - ../../../components/cnpg
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: barman-plugin
      namespace: cnpg-system
  path: ./kubernetes/apps/mikrotik-manager/database
  postBuild:
    substitute:
      APP: mikrotik-manager-database
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: mikrotik-manager-database
      namespace: mikrotik-manager
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: mikrotik-manager
      namespace: mikrotik-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mikrotik-manager-influxdb
spec:
  targetNamespace: mikrotik-manager
  components:
    - ../../../components/kopiur/backup
  dependsOn:
    - name: mikrotik-manager-database
    - name: kopiur-repository
      namespace: kopiur-system
  path: ./kubernetes/apps/mikrotik-manager/influxdb
  postBuild:
    substitute:
      APP: mikrotik-manager-influxdb
      KOPIUR_CAPACITY: 10Gi
      # The upstream InfluxDB entrypoint runs as root and writes its CLI config.
      KOPIUR_PUID: "0"
      KOPIUR_PGID: "0"
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mikrotik-manager-influxdb
      namespace: mikrotik-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mikrotik-manager-valkey
spec:
  targetNamespace: mikrotik-manager
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
  path: ./kubernetes/apps/mikrotik-manager/valkey
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mikrotik-manager-valkey
      namespace: mikrotik-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mikrotik-manager
spec:
  targetNamespace: mikrotik-manager
  components:
    - ../../../components/kopiur/backup
  dependsOn:
    - name: mikrotik-manager-influxdb
    - name: mikrotik-manager-valkey
    - name: multus-networks
      namespace: kube-system
    - name: multi-networkpolicy-nftables
      namespace: kube-system
    - name: kanidm-instance
      namespace: security
  path: ./kubernetes/apps/mikrotik-manager/app
  postBuild:
    substitute:
      APP: mikrotik-manager
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "100"
      KOPIUR_PGID: "101"
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mikrotik-manager
      namespace: mikrotik-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
