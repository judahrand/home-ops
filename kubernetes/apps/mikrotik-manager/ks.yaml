---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mikrotik-manager-database
spec:
  targetNamespace: mikrotik-manager
  components:
    - ../../../components/cnpg
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: barman-plugin
      namespace: cnpg-system
  path: ./kubernetes/apps/mikrotik-manager/database
  postBuild:
    substitute:
      APP: mikrotik-manager-database
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: mikrotik-manager-database
      namespace: mikrotik-manager
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: mikrotik-manager
      namespace: mikrotik-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
