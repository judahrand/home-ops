---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mikrotik-manager-database
spec:
  targetNamespace: mikrotik-manager
  components:
    - ../../../components/cnpg
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: barman-plugin
      namespace: cnpg-system
  path: ./kubernetes/apps/mikrotik-manager/database
  postBuild:
    substitute:
      APP: mikrotik-manager-database
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: mikrotik-manager-database
      namespace: mikrotik-manager
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: mikrotik-manager
      namespace: mikrotik-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mikrotik-manager-stores
spec:
  targetNamespace: mikrotik-manager
  components:
    - ../../../components/kopiur/backup
  dependsOn:
    - name: mikrotik-manager-database
    - name: kopiur-repository
      namespace: kopiur-system
  path: ./kubernetes/apps/mikrotik-manager/stores
  postBuild:
    substitute:
      APP: mikrotik-manager-influxdb
      KOPIUR_CAPACITY: 10Gi
      # The upstream InfluxDB entrypoint runs as root and writes its CLI config.
      KOPIUR_PUID: "0"
      KOPIUR_PGID: "0"
  patches:
    - patch: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${APP}
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mikrotik-manager-stores
      namespace: mikrotik-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
