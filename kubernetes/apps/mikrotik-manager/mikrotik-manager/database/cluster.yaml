---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mikrotik-manager-database
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202609281634-standard-bookworm@sha256:2257decb7de100886c14262e646a6dc10b70057005dbc7cae4b6693282727e2b
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enablePDB: true
  affinity:
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: mikrotik_manager
      owner: mikrotik
      secret:
        name: mikrotik-manager-database
  managed:
    roles:
      - name: mikrotik
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: mikrotik-manager-database
  storage:
    size: 10Gi
    storageClass: miroir-slow-local
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mikrotik-manager-database
        serverName: mikrotik-manager-database-v1
