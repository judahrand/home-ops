---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mikrotik-manager
spec:
  chartRef:
    kind: OCIRepository
    name: mikrotik-manager
  interval: 1h
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
    controllers:
      backend:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{"name":"lan","namespace":"kube-system","interface":"net1","ips":["10.0.1.31/24"]}]
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            fsGroup: 101
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          backend:
            image:
              repository: ghcr.io/2gt-media-group-llc/mikrotik-manager-backend
              tag: &release "1.0.42"
            env:
              TZ: Europe/London
              NODE_ENV: production
              PATH: /opt/mikrotik-manager/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              DATABASE_URL: postgresql://mikrotik@mikrotik-manager-database-rw:5432/mikrotik_manager
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mikrotik-manager-database
                    key: password
              REDIS_URL: redis://mikrotik-manager-valkey:6379
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mikrotik-manager-valkey-secret
                    key: password
              INFLUXDB_URL: http://influxdb:8086
              INFLUXDB_ORG: mikrotik-manager
              INFLUXDB_BUCKET: metrics
              INFLUXDB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: mikrotik-manager-influxdb-secret
                    key: INFLUXDB_TOKEN
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: &secret mikrotik-manager-secret
                    key: JWT_SECRET
              ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: ENCRYPTION_KEY
              # Keep localhost available for the bootstrap port-forward.
              CORS_ORIGIN: https://mikrotik-manager.judahrand.net,http://localhost:8080
              PASSWORD_LOGIN: "true"
              POLLER_ROLE: all
              PORT: 3001
              NETFLOW_BIND_PORT: 2055
            probes:
              readiness: &backendProbe
                enabled: true
                custom: true
                spec: &backendProbeSpec
                  httpGet:
                    path: /api/health
                    port: 3001
                  periodSeconds: 5
                  timeoutSeconds: 3
              startup:
                <<: *backendProbe
                spec:
                  <<: *backendProbeSpec
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              # The bundled arp-scan binary gains NET_RAW through its file capability.
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [NET_RAW]
      nginx:
        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        containers:
          nginx:
            image:
              repository: ghcr.io/2gt-media-group-llc/mikrotik-manager-nginx
              tag: *release
            env:
              TLS_MODE: proxy
              # The nginx NetworkPolicy permits HTTP only from internal Envoy.
              TRUSTED_PROXIES: 10.244.0.0/16
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 80
                  periodSeconds: 5
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    service:
      backend:
        forceRename: backend
        controller: backend
        ports:
          http:
            port: 3001
      nginx:
        forceRename: mikrotik-manager
        controller: nginx
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 80
    route:
      app:
        hostnames:
          - mikrotik-manager.judahrand.net
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: nginx
                port: 80
    configMaps:
      discovery:
        data:
          # Upstream calls arp-scan without an interface. Select the LAN
          # explicitly so it scans VLAN 1 instead of the primary pod network.
          arp-scan: |
            #!/bin/sh
            exec /usr/bin/arp-scan --interface=net1 "$@"
    persistence:
      discovery:
        type: configMap
        identifier: discovery
        defaultMode: 0555
        advancedMounts:
          backend:
            backend:
              - path: /opt/mikrotik-manager/bin
      data:
        existingClaim: mikrotik-manager
        advancedMounts:
          backend:
            backend:
              - path: /app/data
                subPath: data
              - path: /app/backups
                subPath: backups
      tmp:
        type: emptyDir
        advancedMounts:
          backend:
            backend:
              - path: /tmp
          nginx:
            nginx:
              - path: /tmp
                subPath: tmp
              - path: /var/cache/nginx
                subPath: cache
              - path: /var/run
                subPath: run
              - path: /certs
                subPath: certs
