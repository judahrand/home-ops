---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mikrotik-manager-influxdb
spec:
  chartRef:
    kind: OCIRepository
    name: mikrotik-manager-influxdb
  interval: 1h
  values:
    controllers:
      influxdb:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          terminationGracePeriodSeconds: 60
        containers:
          influxdb:
            image:
              repository: mirror.gcr.io/library/influxdb
              tag: "2.7"
              digest: sha256:b8d940ca9376f85118260f5b6bd236b8a00b1749c3350c5578d4cde8e27f31f2
            env:
              DOCKER_INFLUXDB_INIT_MODE: setup
              DOCKER_INFLUXDB_INIT_USERNAME: admin
              DOCKER_INFLUXDB_INIT_ORG: mikrotik-manager
              DOCKER_INFLUXDB_INIT_BUCKET: metrics
              DOCKER_INFLUXDB_INIT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: &secret mikrotik-manager-influxdb-secret
                    key: INFLUXDB_ADMIN_PASSWORD
              DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: INFLUXDB_TOKEN
            probes:
              readiness: &influxProbe
                enabled: true
                custom: true
                spec: &influxProbeSpec
                  httpGet:
                    path: /health
                    port: 8086
                  periodSeconds: 5
                  timeoutSeconds: 3
              startup:
                <<: *influxProbe
                spec:
                  <<: *influxProbeSpec
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      influxdb:
        forceRename: influxdb
        controller: influxdb
        ports:
          http:
            port: 8086
    persistence:
      influxdb:
        existingClaim: mikrotik-manager-influxdb
        advancedMounts:
          influxdb:
            influxdb:
              - path: /var/lib/influxdb2
                subPath: data
              - path: /etc/influxdb2
                subPath: config
