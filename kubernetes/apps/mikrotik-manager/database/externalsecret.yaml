---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-manager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-manager-secret
  data:
    - secretKey: INFLUXDB_TOKEN
      remoteRef:
        key: mikrotik-manager
        property: influxdb_token
    - secretKey: INFLUXDB_ADMIN_PASSWORD
      remoteRef:
        key: mikrotik-manager
        property: influxdb_admin_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: mikrotik-manager
        property: jwt_secret
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: mikrotik-manager
        property: encryption_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-manager-database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-manager-database
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mikrotik
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: mikrotik-manager
        property: postgres_password
