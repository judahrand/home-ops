---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mikrotik-manager-netflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mikrotik-manager
      app.kubernetes.io/controller: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: ${NETFLOW_EXPORTER_CIDR}
      ports:
        - port: 2055
          protocol: UDP
