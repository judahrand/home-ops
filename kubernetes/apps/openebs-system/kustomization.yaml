---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openebs-system
components:
  - ../../components/alerts
  - ../../components/repos
resources:
  - ./namespace.yaml
  - ./openebs/ks.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        labels:
          pod-security.kubernetes.io/enforce: privileged
