---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwrt-backup
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openwrt-backup
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    controllers:
      snapshot:
        type: cronjob

        annotations:
          reloader.stakater.com/auto: "true"

        cronjob: &cronJobSpec
          schedule: "@daily"
          timeZone: "Europe/London"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1

        defaultContainerOptions: &defaultContainerOptions
          env:
            HOME: /kopia
            KOPIA_CACHE_DIRECTORY: /kopia/cache
            KOPIA_CONFIG_PATH: /kopia/repository.config
            KOPIA_LOG_DIR: /kopia/logs
            TMPDIR: /kopia
            USER: backup
            TIMEZONE: "Europe/London"
          envFrom:
            - secretRef:
                name: openwrt-backup-secret
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

        initContainers:
          export:
            image:
              repository: ghcr.io/instrumentisto/rsync-ssh
              tag: alpine3.20-r3
            command: ["/scripts/export.sh", "/backup"]
            securityContext:
              <<: *securityContext
              runAsUser: 65534

        containers:
          backup:
            image:
              repository: ghcr.io/home-operations/kopia
              tag: 0.23.1
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -euo pipefail
                cd /kopia
                repo() {
                  kopia repository "$1" s3 \
                    --bucket=kopia-openwrt \
                    --endpoint="$AWS_ENDPOINT" \
                    --region="$AWS_REGION" \
                    --cache-directory=/kopia/cache
                }
                repo connect || repo create
                kopia snapshot create /backup \
                  --override-source=default@openwrt-backup:/backup
                kopia policy set default@openwrt-backup:/backup \
                  --keep-daily=7 --keep-weekly=4
                kopia snapshot expire --delete default@openwrt-backup:/backup

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    persistence:
      backup:
        type: emptyDir
      kopia:
        type: emptyDir
        globalMounts:
          - path: /kopia
      scripts:
        type: configMap
        name: openwrt-backup
        defaultMode: 0550
        advancedMounts:
          snapshot:
            export:
              - path: /scripts/export.sh
                subPath: export.sh
      ssh-key:
        type: secret
        name: openwrt-backup-secret
        defaultMode: 256
        advancedMounts:
          snapshot:
            export:
              - path: .ssh/id_ed25519
                subPath: SSH_KEY
              - path: .ssh/known_hosts
                subPath: KNOWN_HOSTS
