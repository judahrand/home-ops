---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-backup
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: truenas-backup
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    controllers:
      snapshot:
        type: cronjob

        annotations:
          reloader.stakater.com/auto: "true"

        cronjob: &cronJobSpec
          schedule: "@daily"
          timeZone: Europe/London
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1

        defaultContainerOptions: &defaultContainerOptions
          env:
            HOME: /kopia
            KOPIA_CACHE_DIRECTORY: /kopia/cache
            KOPIA_CONFIG_PATH: /kopia/repository.config
            KOPIA_LOG_DIR: /kopia/logs
            TMPDIR: /kopia
            USER: backup
            TIMEZONE: "Europe/London"
          envFrom:
            - secretRef:
                name: truenas-backup-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

        initContainers:
          export:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-alpine
            env:
              - name: OUTPUT_DIR
                value: /backup
              - name: UV_NO_CACHE
                value: "true"
              - name: UV_CACHE_DIR
                value: /tmp/.uv_cache
            args: ["uv", "run", "/scripts/export.py"]
            securityContext:
              readOnlyRootFilesystem: false

        containers:
          backup:
            image:
              repository: ghcr.io/home-operations/kopia
              tag: 0.22.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -euo pipefail
                cd /kopia
                repo() {
                  kopia repository "$1" s3 \
                    --bucket=kopia-truenas \
                    --endpoint="$AWS_ENDPOINT" \
                    --region="$AWS_REGION" \
                    --cache-directory=/kopia/cache
                }
                repo connect || repo create
                kopia snapshot create /backup \
                  --override-source=default@truenas-backup:/backup
                kopia policy set default@truenas-backup:/backup \
                  --keep-daily=7 --keep-weekly=4
                kopia snapshot expire --delete default@truenas-backup:/backup

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    persistence:
      backup:
        type: emptyDir
      kopia:
        type: emptyDir
        globalMounts:
          - path: /kopia
      scripts:
        type: configMap
        name: truenas-backup
        defaultMode: 0550
        advancedMounts:
          snapshot:
            export:
              - path: /scripts/export.py
                subPath: export.py
