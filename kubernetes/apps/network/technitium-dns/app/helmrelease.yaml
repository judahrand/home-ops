---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app technitium-dns
spec:
  chartRef:
    kind: OCIRepository
    name: technitium-dns
  interval: 1h
  values:
    fullnameOverride: *app
    provider:
      name: rfc2136
    env:
      - name: LOG_LEVEL
        value: debug
      - name: "EXTERNAL_DNS_RFC2136_TSIG_SECRET"
        valueFrom:
          secretKeyRef:
            name: &secret technitium-dns-secret
            key: rfc2136-tsig-secret
      - name: "EXTERNAL_DNS_RFC2136_TSIG_KEYNAME"
        valueFrom:
          secretKeyRef:
            name: *secret
            key: rfc2136-tsig-keyname
      - name: "EXTERNAL_DNS_RFC2136_HOST"
        valueFrom:
          secretKeyRef:
            name: *secret
            key: rfc2136-host
      - name: "EXTERNAL_DNS_RFC2136_PORT"
        valueFrom:
          secretKeyRef:
            name: *secret
            key: rfc2136-port
    extraArgs:
      - --rfc2136-zone=judahrand.net
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-axfr
    policy: sync
    sources: ["gateway-httproute", "service"]
    txtOwnerId: main
    txtPrefix: k8s.main.
    domainFilters:
      - judahrand.net
      - internal
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 128Mi
