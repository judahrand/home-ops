---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
spec:
  chartRef:
    kind: OCIRepository
    name: kromgo
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      prometheus: http://prometheus-operated.o11y.svc.cluster.local:9090
      defaults:
        badge:
          style: for-the-badge
          size: 12
      badges:
        - id: talos_version
          title: Talos
          query: label_replace(node_os_info{name="Talos"}, "version_id", "$1", "version_id", "v(.+)")
          valueExpr: labels["version_id"]
        - id: kubernetes_version
          title: Kubernetes
          query: label_replace(kubernetes_build_info{service="kubernetes"}, "git_version", "$1", "git_version", "v(.+)")
          valueExpr: labels["git_version"]
        - id: flux_version
          title: Flux
          query: label_replace(flux_instance_info, "revision", "$1", "revision", "v(.+)@sha256:.+")
          valueExpr: labels["revision"]
        - id: cluster_node_count
          title: Nodes
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          valueExpr: string(int(result))
          colorExpr: '"green"'
        - id: cluster_pod_count
          title: Pods
          query: sum(kube_pod_status_phase{phase="Running"})
          valueExpr: string(int(result))
          colorExpr: '"green"'
        - id: cluster_cpu_usage
          title: CPU
          query: round(avg(instance:node_cpu_utilisation:rate5m{pod!=""}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'
        - id: cluster_memory_usage
          title: Memory
          query: round(sum(node_memory_MemTotal_bytes{pod!=""} - node_memory_MemAvailable_bytes{pod!=""}) / sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'
        - id: cluster_power_usage
          title: Power
          query: upsAdvOutputActivePower
          valueExpr: humanizeCommas(result) + "w"
          colorExpr: 'colorScale(result, [400.0, 750.0], ["green", "orange", "red"])'
        - id: cluster_age_days
          title: Age
          query: round((time() - min(kube_node_created)) / 86400)
          valueExpr: string(int(result)) + "d"
          colorExpr: 'colorScale(result, [180.0, 360.0], ["green", "orange", "red"])'
        - id: cluster_uptime_days
          title: Uptime
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}) / 86400)
          valueExpr: string(int(result)) + "d"
          colorExpr: 'colorScale(result, [180.0, 360.0], ["green", "orange", "red"])'
        - id: cluster_alert_count
          title: Alerts
          query: alertmanager_alerts{state="active"} - 1
          valueExpr: string(int(result))
          colorExpr: 'colorScale(result, [0.0], ["green", "red"])'
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      hostnames:
        - "{{ .Release.Name }}.judahrand.net"
      parentRefs:
        - name: envoy-external
          namespace: network
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
