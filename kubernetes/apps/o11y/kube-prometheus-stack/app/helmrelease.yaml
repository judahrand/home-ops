---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.judahrand.net
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.judahrand.net
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.judahrand.net
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.judahrand.net
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          dashboards: grafana
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
  postRenderers:
    - kustomize:
        patches:
          # Reuse the upstream expressions and keep the public series fresh for instant queries.
          # The tests catch upstream rule reordering before a chart upgrade can patch the wrong rule.
          - patch: |-
              - op: test
                path: /spec/groups/0/name
                value: kube-apiserver-availability.rules
              - op: test
                path: /spec/groups/0/rules/0/record
                value: code_verb:apiserver_request_total:increase30d
              - op: test
                path: /spec/groups/0/rules/4/record
                value: cluster_verb_scope_le:apiserver_request_sli_duration_seconds_bucket:increase30d
              - op: add
                path: /spec/groups/-
                value:
                  name: kube-apiserver-availability-30d.rules
                  interval: 30m
                  rules: []
              - op: copy
                from: /spec/groups/0/rules/0
                path: /spec/groups/1/rules/-
              - op: copy
                from: /spec/groups/0/rules/4
                path: /spec/groups/1/rules/-
              - op: replace
                path: /spec/groups/1/rules/0/record
                value: code_verb:apiserver_request_total:increase30d_cached
              - op: replace
                path: /spec/groups/1/rules/1/record
                value: cluster_verb_scope_le:apiserver_request_sli_duration_seconds_bucket:increase30d_cached
              - op: replace
                path: /spec/groups/0/rules/0/expr
                value: last_over_time(code_verb:apiserver_request_total:increase30d_cached[45m])
              - op: replace
                path: /spec/groups/0/rules/4/expr
                value: last_over_time(cluster_verb_scope_le:apiserver_request_sli_duration_seconds_bucket:increase30d_cached[45m])
            target:
              group: monitoring.coreos.com
              version: v1
              kind: PrometheusRule
              name: kube-prometheus-stack-kube-apiserver-availability.rules
