---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

# Pushover alerts, mirroring onedr0p/home-ops. The tokens come from the gatus
# 1Password item via the ExternalSecret: gatus_pushover_token exists today,
# gatus_pushover_user_key still needs adding to that item.
alerting:
  pushover:
    application-token: ${gatus_pushover_token}
    user-key: ${gatus_pushover_user_key}
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    priority: 1
    resolved-priority: 0
    title: Gatus

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/17158624
  link: https://github.com/judahrand
  buttons:
    - name: Github
      link: https://github.com/judahrand
    - name: Homelab
      link: https://github.com/judahrand/home-ops

web:
  port: ${GATUS_WEB_PORT}
