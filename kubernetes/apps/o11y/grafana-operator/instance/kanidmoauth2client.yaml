---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: grafana
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Grafana
  origin: https://grafana.judahrand.net/
  redirectUrl:
    - https://grafana.judahrand.net/login/generic_oauth
  scopeMap:
    - group: grafana_users@auth.judahrand.net
      scopes:
        - openid
        - profile
        - email
        - groups
  # Grafana uses PKCE (use_pkce), so PKCE stays required. It does not validate
  # the id_token signature by default, so no legacy RS256 crypto is needed.
  preferShortUsername: true
  disableConsentPrompt: true
