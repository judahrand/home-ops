---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rook-ceph
components:
  - ../../components/alerts
  - ../../components/repos
resources:
  - ./namespace.yaml
  # Flux-Kustomizations
  - ./rook-ceph/ks.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        labels:
          pod-security.kubernetes.io/enforce: privileged
