---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app esphome
spec:
  chartRef:
    kind: OCIRepository
    name: esphome
  interval: 1h
  values:
    controllers:
      esphome:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name":"iot",
                  "namespace": "kube-system",
                  "ips": ["10.0.60.85/24"],
                  "mac": "02:00:00:60:00:85"
                },
                {
                  "name":"iot-infra",
                  "namespace": "kube-system",
                  "ips": ["10.0.80.53/24"],
                  "mac": "02:00:00:80:00:53"
                }
              ]
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            # net1 is the Multus "iot" interface, net2 is "iot-infra".
            # These let both interfaces autoconfigure an IPv6 address via SLAAC.
            sysctls:
              - name: net.ipv6.conf.net1.forwarding
                value: "0"
              - name: net.ipv6.conf.net1.accept_ra
                value: "1"
              - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
                value: "64"
              - name: net.ipv6.conf.net2.forwarding
                value: "0"
              - name: net.ipv6.conf.net2.accept_ra
                value: "1"
              - name: net.ipv6.conf.net2.accept_ra_rt_info_max_plen
                value: "64"

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/esphome
              tag: 2026.10.0
              pullPolicy: IfNotPresent
            env:
              TZ: Europe/London
              ESPHOME__INSTANCE_NAME: ESPHome
              ESPHOME__PORT: &port 6052
              ESPHOME__APPLICATION_URL: &host "esphome.judahrand.net"
              ESPHOME__LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 15m
                memory: "100M"
              limits:
                memory: "8G"

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: esphome
        advancedMounts:
          esphome:
            app:
              - path: /config
      cache:
        type: emptyDir
        advancedMounts:
          esphome:
            app:
              - path: /cache
      tmp:
        type: emptyDir
        advancedMounts:
          esphome:
            app:
              - path: /tmp

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.judahrand.net"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
