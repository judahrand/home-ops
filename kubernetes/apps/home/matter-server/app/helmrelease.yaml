---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matter-server
spec:
  chartRef:
    kind: OCIRepository
    name: matter-server
  interval: 1h
  values:
    global:
      nameOverride: *app
      fullnameOverride: *app

    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"iot-infra",
                "namespace": "kube-system",
                "ips": ["10.0.80.50/24"],
                "mac": "02:00:00:80:00:50"
              }]
          securityContext:
            runAsNonRoot: false # Must be run as root user
            runAsUser: 0 # Must be run as root user
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 34
            sysctls:
              - name: net.ipv6.conf.net1.forwarding
                value: "1"
              - name: net.ipv6.conf.net1.accept_ra
                value: "2"
              - name: net.ipv6.conf.net1.accept_ra_defrtr
                value: "1"
              - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
                value: "64"

        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.5.3@sha256:c0a816559384497f30d5cfe32dcd049fdec90c5659f1a1a86c87600fb3298595
              pullPolicy: IfNotPresent
            env:
              STORAGE_PATH: /data
              PORT: &port 5580
              LOG_LEVEL: debug
              PRIMARY_INTERFACE: net1
              ENABLE_TEST_NET_DCL: true
              BLE_PROXY: true
              ENABLE_TIME_SYNC: true
              PRODUCTION_MODE: true
              TZ: Europe/London
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 15m
                memory: "150M"
              limits:
                memory: "256M"

    service:
      app:
        controller: *app
        ports:
          api:
            protocol: TCP
            port: *port

    persistence:
      config:
        existingClaim: matter-server
        advancedMounts:
          matter-server:
            app:
              - path: "/data"

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.judahrand.net"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
