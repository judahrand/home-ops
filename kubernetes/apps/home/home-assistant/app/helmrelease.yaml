---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name":"iot",
                  "namespace": "kube-system",
                  "ips": ["10.0.60.87/24"],
                  "mac": "02:00:00:60:00:87"
                },
                {
                  "name":"iot-infra",
                  "namespace": "kube-system",
                  "ips": ["10.0.80.52/24"],
                  "mac": "02:00:00:80:00:52"
                }
              ]

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.3@sha256:3a5bf87bb8192cbef21a2e44383477a48a227c2dd19c2383ada2cb229981c127
            env:
              TIMEZONE: Europe/London
              UV_NO_CACHE: "true"
              # Kanidm OIDC (auth_oidc) — secret is managed by the KanidmOAuth2Client.
              OIDC_CLIENT_ID: homeassistant
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: homeassistant-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 4Gi

          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
            env:
              TIMEZONE: Europe/London
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - "12321"
              - /config
            resources:
              requests:
                cpu: 10m
                memory: 256M
              limits:
                memory: 512M

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
        # sysctls is a pod-level securityContext field - the API rejects it under
        # a container. net1 is the Multus "iot" interface, net2 is "iot-infra".
        # These let both interfaces autoconfigure an IPv6 address via SLAAC.
        sysctls:
          - name: net.ipv6.conf.net1.forwarding
            value: "0"
          - name: net.ipv6.conf.net1.accept_ra
            value: "1"
          - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
            value: "64"
          - name: net.ipv6.conf.net2.forwarding
            value: "0"
          - name: net.ipv6.conf.net2.accept_ra
            value: "1"
          - name: net.ipv6.conf.net2.accept_ra_rt_info_max_plen
            value: "64"

    service:
      app:
        controller: home-assistant
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: &hass-port 8123
          code-server:
            port: &code-port 12321

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.judahrand.net"
          - homeassistant.judahrand.net
          - hass.judahrand.net
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *hass-port

      code-server:
        hostnames:
          - hass-code.judahrand.net
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *code-port

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config

      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      deploy-key:
        type: secret
        name: home-assistant-secret
        defaultMode: 256
        globalMounts:
          - path: /root/.ssh/id_ed25519
            subPath: GH_DEPLOY_KEY
          - path: /root/.ssh/known_hosts
            subPath: GH_KNOWN_HOSTS
