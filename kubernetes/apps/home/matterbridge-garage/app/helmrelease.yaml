---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matterbridge-garage
spec:
  chartRef:
    kind: OCIRepository
    name: matterbridge-garage
  interval: 1h
  values:
    controllers:
      matterbridge-garage:
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 60
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name": "iot-infra",
                "namespace": "kube-system",
                "interface": "net1",
                "ips": ["10.0.80.55/24"],
                "mac": "02:00:00:80:00:55"
              }]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
            sysctls:
              - name: net.ipv6.conf.net1.forwarding
                value: "0"
              - name: net.ipv6.conf.net1.accept_ra
                value: "1"
              - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
                value: "64"
        containers:
          app:
            image:
              repository: docker.io/luligu/matterbridge
              tag: 3.10.14@sha256:47f86fe9ae00f53393b63d267b9cb671a101b0a2082de8a4b27cf44232729508
            # Bypass the image entrypoint so startup works without root privileges.
            command:
              - matterbridge
            workingDir: /data
            args:
              - --docker
              - --homedir
              - /data
              - --profile
              - garage
              - --childbridge
              - --mdnsinterface
              - net1
              - --frontend
              - "8283"
              - --port
              - "5540"
              - --no-ansi
            env:
              TZ: Europe/London
              HOME: /data
              NPM_CONFIG_PREFIX: /data/.npm-global
              NPM_CONFIG_CACHE: /data/.npm-cache
              PATH: /data/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8283
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.judahrand.net"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
