---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matterbridge-camera
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: matterbridge-camera-secret
  data:
    - secretKey: REOSTREAM_USERNAME
      remoteRef:
        key: reostream
        property: username
    - secretKey: REOSTREAM_PASSWORD
      remoteRef:
        key: reostream
        property: password
