---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt-core
spec:
  chartRef:
    kind: OCIRepository
    name: zigbee2mqtt-core
  interval: 1h
  values:
    global:
      nameOverride: zigbee2mqtt-core
      fullnameOverride: zigbee2mqtt-core

    controllers:
      zigbee2mqtt-core:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
            env:
              TZ: Europe/London
              ZIGBEE2MQTT_DATA: /data
              ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL: "20"
              ZIGBEE2MQTT_CONFIG_ADVANCED_LAST_SEEN: ISO_8601
              ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL: info # debug
              ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_OUTPUT: '["console"]'
              ZIGBEE2MQTT_CONFIG_AVAILABILITY_ACTIVE_TIMEOUT: "60"
              ZIGBEE2MQTT_CONFIG_AVAILABILITY_PASSIVE_TIMEOUT: "2000"
              ZIGBEE2MQTT_CONFIG_DEVICE_OPTIONS_RETAIN: "true"
              ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
              ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
              ZIGBEE2MQTT_CONFIG_FRONTEND_URL: https://zigbee2mqtt-core.judahrand.net
              ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_DISCOVERY_TOPIC: homeassistant
              ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_STATUS_TOPIC: homeassistant/status
              ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC: zigbee2mqtt/core
              ZIGBEE2MQTT_CONFIG_MQTT_INCLUDE_DEVICE_INFORMATION: "true"
              ZIGBEE2MQTT_CONFIG_MQTT_KEEPALIVE: "60"
              ZIGBEE2MQTT_CONFIG_MQTT_REJECT_UNAUTHORIZED: "true"
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto.home.svc.cluster.local:1883
              ZIGBEE2MQTT_CONFIG_MQTT_VERSION: "5"
              ZIGBEE2MQTT_CONFIG_PERMIT_JOIN: "false"
              ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE: "115200"
              ZIGBEE2MQTT_CONFIG_SERIAL_DISABLE_LED: "false"
              ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: zstack
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: tcp://slzb-ultima3.iot-infra:7638
            # envFrom:
            #   - secretRef:
            #       name: zigbee2mqtt-core-secret
            ports:
              - containerPort: 8080
                name: http
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /
                port: 8080
                spec:
                  failureThreshold: 5
                  initialDelaySeconds: 10
                  timeoutSeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                type: HTTP
                path: /
                port: 8080
                spec:
                  failureThreshold: 5
                  initialDelaySeconds: 5
                  timeoutSeconds: 10
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 250M
              limits:
                memory: 250M

    defaultPodOptions:
      securityContext:
        fsGroup: 568

    service:
      app:
        controller: zigbee2mqtt-core
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.judahrand.net"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    persistence:
      config:
        # The kopiur backup component owns the PVC, which keeps the original name.
        existingClaim: zigbee2mqtt-core
        advancedMounts:
          zigbee2mqtt-core:
            app:
              - path: /data
