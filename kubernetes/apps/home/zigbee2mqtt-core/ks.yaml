---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt-core
spec:
  targetNamespace: home
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: mosquitto
      namespace: home
  path: ./kubernetes/apps/home/zigbee2mqtt-core/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  postBuild:
    substitute:
      # APP intentionally stays `zigbee2mqtt`: it names the existing PVC, SnapshotPolicy
      # and Restore. Renaming it would orphan the backups and force re-pairing of every
      # device. The Kubernetes objects are named `zigbee2mqtt-core`; only the backup
      # chain keeps the original name.
      APP: zigbee2mqtt
      KOPIUR_CAPACITY: 1Gi
