---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: frigate-secret
    template:
      engineVersion: v2
      data:
        FRIGATE_REOSTREAM_USER: "{{ .username }}"
        FRIGATE_REOSTREAM_PASSWORD: "{{ .password }}"
        PLUS_API_KEY: "{{ .PLUS_API_KEY }}"
  dataFrom:
    - extract:
        key: reostream
    - extract:
        key: frigate
