---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: autobrr
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: autobrr
  origin: https://autobrr.judahrand.net/
  redirectUrl:
    - https://autobrr.judahrand.net/api/auth/oidc/callback
  scopeMap:
    - group: autobrr_users@auth.judahrand.net
      scopes:
        - openid
        - profile
        - email
  # autobrr uses PKCE when the provider advertises S256 and validates the
  # id_token via go-oidc (ES256), so PKCE stays required and no legacy crypto is
  # needed.
  preferShortUsername: true
  disableConsentPrompt: true
