---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kyoo
spec:
  chartRef:
    kind: OCIRepository
    name: kyoo
  interval: 1h
  values:
    global:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      postgres:
        shared:
          host: postgres17-rw.cnpg-system.svc.cluster.local
          port: 5432
          databaseOverride: *app
          existingSecret: &secret kyoo-secret
          userKey: POSTGRES_USER
          passwordKey: POSTGRES_PASSWORD
    kyoo:
      address: https://kyoo.judahrand.net
      middlewareRootURL: https://kyoo.judahrand.net
      transcoderAcceleration: vaapi # hardware acceleration profile (valid values: disabled, vaapi, qsv, nvidia)
      oidc_providers:
        - name: kanidm
          existingSecret: kyoo-kanidm-oauth2-credentials
          clientIdKey: CLIENT_ID
          clientSecretKey: CLIENT_SECRET
          authorizationAddress: https://auth.judahrand.net/ui/oauth2
          tokenAddress: https://auth.judahrand.net/oauth2/token
          profileAddress: https://auth.judahrand.net/oauth2/openid/kyoo/userinfo
          scope: openid email profile
          authMethod: ClientSecretBasic
      auth:
        apikeys:
          scanner:
            existingSecret: *secret
            apikeyKey: KYOO_API_KEY
        privatekey:
          existingSecret: *secret
          privatekeyKey: RSA_PRIVATE_KEY
    media:
      volumes:
        - name: media
          nfs:
            server: truenas.servers
            path: /mnt/main/media
    contentdatabase:
      tmdb:
        apikeyKey: TMDB_API_KEY
        existingSecret: *secret
      tvdb:
        apikeyKey: TVDB_APIKEY
        pinKey: TVDB_PIN
        existingSecret: *secret
    api:
      persistence:
        existingClaim: *app
      service:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: kyoo-api
            group: services
            url: http://kyoo-api.media.svc.cluster.local:3567/api/health
            interval: 1m
            ui:
              hide-url: true
              hide-hostname: true
            conditions:
              - "[STATUS] == 200"
      kyoo_api:
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 8Gi
    auth:
      kyoo_auth:
        resources:
          requests:
            cpu: 20m
            memory: 50Mi
          limits:
            cpu: 2
            memory: 500Mi
    front:
      kyoo_front:
        resources:
          requests:
            cpu: 20m
            memory: 50Mi
          limits:
            cpu: 2
            memory: 500Mi
    scanner:
      kyoo_scanner:
        resources:
          requests:
            cpu: 5m
            memory: 100Mi
          limits:
            cpu: 1
            memory: 1Gi
    transcoder:
      persistence:
        size: 30Gi
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
      resourceClaims:
        - name: i915
          resourceClaimTemplateName: kyoo-gpu
      kyoo_transcoder:
        resources:
          claims:
            - name: i915
          requests:
            cpu: 100m
            memory: 500Mi
          limits:
            cpu: 2
            memory: 8Gi
    postgres:
      enabled: false
    ingress:
      enabled: false
    traefikproxy:
      enabled: false
    extraObjects:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: kyoo
        spec:
          hostnames: ["kyoo.judahrand.net"]
          parentRefs:
            - name: envoy-external
              namespace: network
          rules:
            - name: api
              matches:
                - path:
                    type: PathPrefix
                    value: /api
                - path:
                    type: PathPrefix
                    value: /swagger
              backendRefs:
                - name: kyoo-api
                  namespace: media
                  port: 3567
            - name: auth
              matches:
                - path:
                    type: PathPrefix
                    value: /auth
                - path:
                    type: PathPrefix
                    value: /.well-known
              backendRefs:
                - name: kyoo-auth
                  namespace: media
                  port: 4568
            - name: transcoder
              matches:
                - path:
                    type: PathPrefix
                    value: /video
              backendRefs:
                - name: kyoo-transcoder
                  namespace: media
                  port: 7666
            - name: scanner
              matches:
                - path:
                    type: PathPrefix
                    value: /scanner
              backendRefs:
                - name: kyoo-scanner
                  namespace: media
                  port: 4389
            - name: front
              backendRefs:
                - name: kyoo-front
                  namespace: media
                  port: 8901
      - apiVersion: gateway.envoyproxy.io/v1alpha1
        kind: SecurityPolicy
        metadata:
          name: kyoo-auth
        spec:
          targetRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: kyoo
              sectionName: api
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: kyoo
              sectionName: transcoder
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: kyoo
              sectionName: scanner
          extAuth:
            headersToExtAuth:
              - Authorization
              - cookie
              - Sec-WebSocket-Protocol
              - X-Api-Key
              - X-Forwarded-Uri
            recomputeRoute: true
            http:
              backendRefs:
                - name: kyoo-auth
                  namespace: media
                  port: 4568
              path: /auth/jwt
              headersToBackend:
                - Authorization
