---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: kyoo
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Kyoo
  origin: https://kyoo.judahrand.net/
  redirectUrl:
    - https://kyoo.judahrand.net/auth/oidc/logged/kanidm
  scopeMap:
    - group: kyoo_users@auth.judahrand.net
      scopes:
        - openid
        - profile
        - email
  # Kyoo does not send a PKCE challenge and does not verify the id_token
  # (it authenticates with the access token against the userinfo endpoint).
  allowInsecureClientDisablePkce: true
  preferShortUsername: true
  disableConsentPrompt: true
