---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: immich
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Immich
  origin: https://immich.judahrand.net/
  redirectUrl:
    - https://immich.judahrand.net/auth/login
    - https://immich.judahrand.net/user-settings
    - app.immich:///oauth-callback
  scopeMap:
    - group: immich_users@auth.judahrand.net
      scopes:
        - openid
        - profile
        - email
  claimMap:
    - name: immich_role
      joinStrategy: csv
      valuesMap:
        - group: immich_admins@auth.judahrand.net
          values:
            - admin
  strictRedirectUrl: true
  preferShortUsername: true
  disableConsentPrompt: true
