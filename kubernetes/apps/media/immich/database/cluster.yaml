---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:dc7fa2b7418ac5a3c0b25514f70fcdce52b16c3b0eacfc9dd006143adfb0f7c0
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enablePDB: true

  storage:
    size: 10Gi
    storageClass: miroir-slow-local

  superuserSecret:
    name: cloudnative-pg-secret

  enableSuperuserAccess: true

  postgresql:
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: immich-database-secret

  resources:
    requests:
      cpu: 20m
      memory: 512Mi
    limits:
      memory: 4Gi

  # PodMonitor is managed explicitly in ./podmonitor.yaml.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-database
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: &currentCluster immich-database-v8

  # To restore: uncomment the block below, bump the archiver `serverName` above
  # to the next version, and delete the Cluster together with its PVCs so the
  # operator recreates them and runs the recovery.
  #
  # bootstrap:
  #   recovery:
  #     source: &previousCluster immich-database-v4
  #     recoveryTarget:
  #       backupID: 20260830T000003
  #       targetImmediate: true
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: immich-database
  #         serverName: *previousCluster
