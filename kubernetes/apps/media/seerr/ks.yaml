---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr
spec:
  targetNamespace: media
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  # One-time cutover: seed the new `seerr` volume from the old `jellyseerr`
  # snapshot via the kopiur volume populator. Remove this patch once Seerr is
  # verified and has taken its own snapshots.
  patches:
    - target:
        group: kopiur.home-operations.com
        kind: Restore
      patch: |
        - op: replace
          path: /spec/source/fromPolicy/name
          value: jellyseerr
  path: ./kubernetes/apps/media/seerr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  postBuild:
    substitute:
      APP: seerr
