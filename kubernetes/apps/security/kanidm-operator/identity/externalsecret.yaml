---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-person-judah
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kanidm-person-judah
  data:
    - secretKey: KANIDM_DISPLAY_NAME_JUDAH
      remoteRef:
        key: Kanidm (judah)
        property: displayname
    - secretKey: KANIDM_EMAIL_JUDAH
      remoteRef:
        key: Kanidm (judah)
        property: email
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-person-jade
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kanidm-person-jade
  data:
    - secretKey: KANIDM_DISPLAY_NAME_JADE
      remoteRef:
        key: Kanidm (jade)
        property: displayname
    - secretKey: KANIDM_EMAIL_JADE
      remoteRef:
        key: Kanidm (jade)
        property: email
