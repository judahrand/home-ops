---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-operator
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kanidm-operator
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/security/kanidm-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-instance
spec:
  dependsOn:
    - name: kanidm-operator
    - name: kanidm-secrets
  healthChecks:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      name: kanidm
      namespace: security
  healthCheckExprs:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      failed: status.conditions.exists(c, c.type == 'Available' && c.status == 'False')
      current: status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/security/kanidm-operator/instance
  postBuild:
    substituteFrom:
      - kind: Secret
        name: kanidm-persons-secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-secrets
spec:
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: kanidm-persons
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/security/kanidm-operator/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  wait: true
