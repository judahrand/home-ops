---
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupRepository
metadata:
  name: truenas
spec:
  authentication:
    deleter:
      secretRef:
        name: kanidm-backup-secret
    reader:
      secretRef:
        name: kanidm-backup-secret
    writer:
      secretRef:
        name: kanidm-backup-secret
  encryption:
    mode: clientSide
    keyRef:
      name: kanidm-backup-secret
  s3:
    bucket: kanidm
    endpoint: http://truenas.servers:30188
    forcePathStyle: true
    insecure: true
    prefix: kanidm
    region: garage
