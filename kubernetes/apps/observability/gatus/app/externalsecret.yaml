---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gatus-secret
  dataFrom:
    - extract:
        # Field names are used verbatim as the Secret's keys, so the gatus config
        # can reference them as ${gatus_pushover_token} etc.
        key: gatus
