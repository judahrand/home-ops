---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gpu-dra-driver
spec:
  chart:
    spec:
      chart: k8s-gpu-dra-driver
      version: v1.0.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gpu-dra-driver
        namespace: kube-system
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Exposes the gpu.amd.com DeviceClass that frigate's ResourceClaimTemplate asks for.
    deviceClass:
      create: true
    kubeletPlugin:
      nodeSelector:
        amd.feature.node.kubernetes.io/gpu: "true"
    cdi:
      dynamicPath: /run/cdi
