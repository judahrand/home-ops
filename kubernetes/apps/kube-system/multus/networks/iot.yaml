---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  # Keep IPv4 source routing separate from iot-infra in dual-attached pods,
  # and leave the kernel's IPv6 link-local routes in the main table.
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.60",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "10.0.60.0/24", "scope": 253, "table": 1060},
              {"dst": "0.0.0.0/0", "gw": "10.0.60.1", "table": 1060}
            ]
          }
        },
        {
          "type": "sbr",
          "table": 1060
        }
      ]
    }
