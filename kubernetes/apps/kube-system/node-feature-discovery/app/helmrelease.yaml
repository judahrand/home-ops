---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  values:
    nodeFeatureRule.createCRD: true

    worker:
      config:
        core:
          sources: ["pci", "system", "usb"]
      resources:
        requests:
          cpu: 1m
          memory: 64Mi
        limits:
          memory: 512Mi

    master:
      resources:
        requests:
          cpu: 1m
          memory: 128Mi
        limits:
          memory: 4Gi

    gc:
      resources:
        requests:
          cpu: 1m
          memory: 128Mi
        limits:
          memory: 1Gi

    prometheus:
      enable: true
