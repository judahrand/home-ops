---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:dc7fa2b7418ac5a3c0b25514f70fcdce52b16c3b0eacfc9dd006143adfb0f7c0
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  affinity:
    podAntiAffinityType: required

  storage:
    size: 10Gi
    storageClass: miroir-slow-local

  superuserSecret:
    name: cloudnative-pg-secret

  enableSuperuserAccess: true

  # kritika needs VectorChord (`vchord`) and pgvector (`vector`); VectorChord is
  # mounted from TensorChord's scratch image and preloaded. The `vector` and
  # `vchord` extensions are created by ./database.yaml.
  postgresql:
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  # kritika wants three roles: `kritika` owns the database and runs migrations,
  # `kritika_app` is the row-level-security application role (must not own the
  # tables), `kritika_runner` is what review Jobs get.
  managed:
    roles:
      - name: kritika
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: kritika-postgres-credentials
      - name: kritika_app
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: kritika-postgres-app
      - name: kritika_runner
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: kritika-postgres-runner

  resources:
    requests:
      cpu: 20m
      memory: 512Mi
    limits:
      memory: 2Gi

  # PodMonitor is managed explicitly in ./podmonitor.yaml.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kritika-postgres
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: &currentCluster kritika-postgres-v1

  # To restore: uncomment the block below, bump the archiver `serverName` above
  # to the next version, and delete the Cluster together with its PVCs so the
  # operator recreates them and runs the recovery.
  #
  # bootstrap:
  #   recovery:
  #     source: &previousCluster kritika-postgres-v0
  #     recoveryTarget:
  #       backupID: 20260101T000000
  #       targetImmediate: true
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: kritika-postgres
  #         serverName: *previousCluster
