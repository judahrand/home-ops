---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  install:
    # The first install can race the ExternalSecret; retry until it exists.
    remediation:
      retries: -1
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      # Same as runner.image: the chart's released digest wins over any tag, so
      # pin the main build that carries the session header (kritika#322). main
      # at 914bb3b, 2026-10-02.
      digest: "sha256:855b4bc53229bf1d4a0ebdd018d9b67288864b0cf307bb09731704bdb217180d"
      tag: ""
    config:
      webUrl: https://{{ .Release.Name }}.judahrand.net
      # Runner Jobs run under the gVisor RuntimeClass: they parse untrusted
      # repository content and run what the model asks.
      runnerRuntimeClass: gvisor
      defaultsModelsReview: opencode/deepseek-v4.1-flash
      defaultsModelsFallback: openrouter/deepseek/deepseek-v4.1-flash
      embeddingModel: openrouter/voyageai/voyage-code-4
      embeddingDims: 1024
    configFile:
      apps:
        github:
          accounts: [judahrand]
          clientId: { env: KRITIKA_GITHUB_CLIENT_ID }
          privateKey: { env: KRITIKA_GITHUB_PRIVATE_KEY }
          webhookSecret: { env: KRITIKA_GITHUB_WEBHOOK_SECRET }
      providers:
        opencode:
          type: opencode
          apiKey: { env: OPENCODE_API_KEY }
        openrouter:
          type: openrouter
          apiKey: { env: OPENROUTER_API_KEY }
      egress:
        allowHosts: [raw.githubusercontent.com]
      defaults:
        agent:
          # Kritika's fleet default is 60 steps. On a small diff the agent can
          # spend minutes exploring, overrun the 15m runner deadline, get
          # cancelled, and be reviewed again on the next poll. On the last step
          # kritika appends "submit now", so a lower cap still produces a
          # review, just a less exhaustive one. Raise it if reviews feel thin.
          maxSteps: 20
          commands: [gh, curl, jq, yq, rg, fd]
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      app:
        existingSecret: kritika-postgres-app
      owner:
        existingSecret: kritika-postgres-credentials
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      image:
        # The chart defaults `runner.image.digest` to the released -tools
        # digest, which no tag overrides. Clear it and pin the main -tools
        # build that has the session header (kritika#322). main-tools at
        # 914bb3b, 2026-10-02.
        digest: "sha256:dcbf410cbf4902069b6da8c4d2860e0a06e5d842af2ccda9e336190bace09107"
        tag: ""
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /api/v1/meta
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.judahrand.net"
    monitoring:
      serviceMonitor:
        enabled: true
    networkPolicy:
      enabled: true
