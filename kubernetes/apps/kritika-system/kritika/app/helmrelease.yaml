---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  install:
    # The first install can race the ExternalSecret; retry until it exists.
    remediation:
      retries: -1
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://{{ .Release.Name }}.judahrand.net
      # Runner Jobs run under the gVisor RuntimeClass: they parse untrusted
      # repository content and run what the model asks.
      runnerRuntimeClass: gvisor
      # Reviews and the embedder both go through OpenRouter for now. OpenCode
      # Go rejects kritika's requests for a missing `x-opencode-session` header,
      # which kritika 0.0.4 cannot send:
      #   400 MissingSessionID: Request is missing x-opencode-session
      # Switch back to `opencode` (type openai, baseUrl
      # https://opencode.ai/zen/go/v1, model opencode/deepseek-v4.1-flash) once
      # kritika can send a per-conversation session header.
      providersName: openrouter
      providersType: openrouter
      providersApiKey:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: KRITIKA_PROVIDERS_API_KEY
      defaultsModelsReview: openrouter/deepseek/deepseek-v4.1-flash
      embeddingModel: openrouter/voyageai/voyage-code-4
      embeddingDims: 1024
    configFile:
      apps:
        github:
          accounts: [judahrand]
          clientId: { env: KRITIKA_GITHUB_CLIENT_ID }
          privateKey: { env: KRITIKA_GITHUB_PRIVATE_KEY }
          webhookSecret: { env: KRITIKA_GITHUB_WEBHOOK_SECRET }
      egress:
        allowHosts: [raw.githubusercontent.com]
      defaults:
        agent:
          # Kritika's fleet default is 60 steps. On a small diff the agent can
          # spend minutes exploring, overrun the 15m runner deadline, get
          # cancelled, and be reviewed again on the next poll. On the last step
          # kritika appends "submit now", so a lower cap still produces a
          # review, just a less exhaustive one. Raise it if reviews feel thin.
          maxSteps: 20
          commands: [gh, curl, jq, yq, rg, fd]
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      app:
        existingSecret: kritika-postgres-app
      owner:
        existingSecret: kritika-postgres-credentials
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      image:
        tag: 0.0.4-tools
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /api/v1/meta
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.judahrand.net"
    monitoring:
      serviceMonitor:
        enabled: true
    networkPolicy:
      enabled: true
