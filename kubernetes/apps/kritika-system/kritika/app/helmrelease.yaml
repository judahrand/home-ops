---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  install:
    # The first install can race the ExternalSecret; retry until it exists.
    remediation:
      retries: -1
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://{{ .Release.Name }}.judahrand.net
      # Runner Jobs run under the gVisor RuntimeClass: they parse untrusted
      # repository content and run what the model asks.
      runnerRuntimeClass: gvisor
      reviewModel: opencode/deepseek-v4.1-flash
      reviewFallback: openrouter/deepseek/deepseek-v4.1-flash
      embeddingModel: openrouter/voyageai/voyage-code-4
      embeddingDims: 1024
    configFile:
      apps:
        github:
          accounts: [judahrand]
          clientId: { env: KRITIKA_GITHUB_CLIENT_ID }
          privateKey: { env: KRITIKA_GITHUB_PRIVATE_KEY }
          webhookSecret: { env: KRITIKA_GITHUB_WEBHOOK_SECRET }
      providers:
        opencode:
          type: opencode
          apiKey: { env: OPENCODE_API_KEY }
        openrouter:
          type: openrouter
          apiKey: { env: OPENROUTER_API_KEY }
      egress:
        allowHosts:
          - raw.githubusercontent.com
          - konflate.judahrand.net
      agent:
        commands: [gh, curl, jq, yq, rg, fd]
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      app:
        existingSecret: kritika-postgres-app
      owner:
        existingSecret: kritika-postgres-credentials
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /api/v1/meta
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.judahrand.net"
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    networkPolicy:
      enabled: true
