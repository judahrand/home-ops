apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: nas-backup
spec:
  retentionPolicy: 30d

  # MinIO compatibility: boto3 >= 1.36 enables checksum calculation/validation
  # by default, which trips some S3-compatible providers (cloudnative-pg#7715).
  # NB: this does NOT fix the IncompleteRead restore problem
  # (barman#1100 / cnpg/charts#788) - that is what `data.compression` below is
  # about.
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

  configuration:
    destinationPath: s3://cloudnative-pg/
    endpointURL: http://truenas.servers:9000
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg-secret
        key: aws-access-key-id
      secretAccessKey:
        name: cloudnative-pg-secret
        key: aws-secret-access-key
    # gzip, not bzip2: barman-cloud-restore streams and decompresses inside the
    # socket read path, and bzip2 is slow enough that large base backups die
    # mid-download with "IncompleteRead" (barman#1100, cnpg/charts#788).
    data:
      compression: gzip
    wal:
      compression: bzip2
      # restore breaks when raised to 8 (plugin-barman-cloud#516)
      maxParallel: 1
