---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-1@sha256:a584c18aa3d292b5bec7d0bce76b26edcd0a53555adbf607d14b145191a7b7fd
  primaryUpdateStrategy: unsupervised
  enablePDB: true

  storage:
    size: 20Gi
    storageClass: miroir-slow-local

  superuserSecret:
    name: cloudnative-pg-secret

  enableSuperuserAccess: true

  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB

  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: cloudnative-pg-authentik-secret
      - name: homeassistant
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: cloudnative-pg-homeassistant-secret
      - name: kyoo
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: cloudnative-pg-kyoo-secret
      - name: vikunja
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: cloudnative-pg-vikunja-secret

  resources:
    requests:
      cpu: 20m
      memory: 512Mi
    limits:
      memory: 4Gi

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nas-backup
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: &currentCluster postgres17-v5

  # Recovery onto miroir-slow-local. The recent v3 archive only has a small
  # `vikunja` DB, so restore the last full backup (postgres17-v1, 2026-08-30).
  # barman-cloud-restore can't stream the bzip2 base backup from MinIO (it dies
  # mid-download, barman#1100 / charts#788), so the backup is re-published
  # uncompressed under the `postgres17-plain` serverName (`nas-backup-plain`).
  # targetImmediate stops at the backup's consistency point, so only the WAL
  # segments for 2026-08-30 are needed (`postgres17-plain` holds those).
  # Delete the Cluster and its openebs PVCs so the operator recreates them.
  bootstrap:
    recovery:
      source: &previousCluster postgres17-plain
      recoveryTarget:
        backupID: 20260830T000002
        targetImmediate: true
  externalClusters:
    - name: *previousCluster
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: nas-backup-plain
          serverName: *previousCluster
