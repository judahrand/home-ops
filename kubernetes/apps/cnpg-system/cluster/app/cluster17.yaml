---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202609281634-standard-bookworm@sha256:61207ab4e051645dcb9901e1ec9358b01e4adb45624cb4425be1eab27eac6508
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enablePDB: true

  storage:
    size: 20Gi
    storageClass: miroir-slow-local

  superuserSecret:
    name: cloudnative-pg-secret

  enableSuperuserAccess: true

  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: cloudnative-pg-authentik-secret
      - name: homeassistant
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: cloudnative-pg-homeassistant-secret
      - name: kyoo
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: cloudnative-pg-kyoo-secret
      - name: vikunja
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: cloudnative-pg-vikunja-secret

  resources:
    requests:
      cpu: 20m
      memory: 512Mi
    limits:
      memory: 4Gi

  # PodMonitor is managed explicitly in ./podmonitor.yaml.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nas-backup
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: &currentCluster postgres17-v5

  # To restore: uncomment the block below, bump the archiver `serverName` above
  # to the next version, and delete the Cluster together with its PVCs so the
  # operator recreates them and runs the recovery.
  #
  # bootstrap:
  #   recovery:
  #     source: &previousCluster postgres17-plain
  #     recoveryTarget:
  #       backupID: 20260830T000002
  #       targetImmediate: true
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: nas-backup-plain
  #         serverName: *previousCluster
  #
  # The `postgres17-plain` copy has to be re-published first (see commit
  # fd1b19bb), because barman-cloud-restore cannot stream the bzip2 originals
  # from MinIO (barman#1100 / cnpg/charts#788). Restoring from the current
  # `postgres17-v5` archive above with `nas-backup` needs no such dance: since
  # 2026-09-29 base backups are gzip.
