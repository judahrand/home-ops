---
apiVersion: v1
kind: Service
metadata:
  name: postgres-lb
  annotations:
    external-dns.kubernetes.io/hostname: postgres.judahrand.net
    io.cilium/lb-ipam-ips: 10.0.42.125
    gatus.home-operations.com/endpoint: |
      name: postgres
      group: infrastructure
      url: tcp://postgres17-rw.cnpg-system.svc.cluster.local:5432
      interval: 1m
      ui:
        hide-url: true
        hide-hostname: true
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: pushover
spec:
  type: LoadBalancer
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres17
    cnpg.io/instanceRole: primary
