---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bambu-studio-api
spec:
  targetNamespace: selfhosted
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/selfhosted/bambu-studio-api/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  postBuild:
    substitute:
      APP: bambu-studio-api
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
