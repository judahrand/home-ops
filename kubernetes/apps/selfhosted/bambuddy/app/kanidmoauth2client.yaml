---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: bambuddy
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: BamBuddy
  origin: https://bambuddy.judahrand.net/
  redirectUrl:
    - https://bambuddy.judahrand.net/api/v1/auth/oidc/callback
  scopeMap:
    - group: bambuddy_users@auth.judahrand.net
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
  disableConsentPrompt: true
