---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: karakeep
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Karakeep
  origin: https://karakeep.judahrand.net/
  redirectUrl:
    # Karakeep's OAuth provider id is always "custom".
    - https://karakeep.judahrand.net/api/auth/callback/custom
  scopeMap:
    - group: karakeep_users@auth.judahrand.net
      scopes:
        - openid
        - profile
        - email
  # Karakeep (better-auth) uses PKCE, so PKCE stays required.
  # Its openid-client hard-expects an RS256 id_token and exposes no alg option,
  # so this client must use Kanidm's legacy crypto (Kanidm then signs RS256).
  jwtLegacyCryptoEnable: true
  preferShortUsername: true
  disableConsentPrompt: true
