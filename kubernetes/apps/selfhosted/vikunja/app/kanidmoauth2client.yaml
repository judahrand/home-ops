---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: vikunja
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Vikunja
  origin: https://vikunja.judahrand.net/
  redirectUrl:
    - https://vikunja.judahrand.net/auth/openid/kanidm
  scopeMap:
    - group: vikunja_users@auth.judahrand.net
      scopes:
        - openid
        - profile
        - email
  # Vikunja does not use PKCE (the frontend builds the authorize URL and the
  # backend exchanges the code with no code_verifier), so PKCE must be relaxed.
  allowInsecureClientDisablePkce: true
  preferShortUsername: true
  disableConsentPrompt: true
