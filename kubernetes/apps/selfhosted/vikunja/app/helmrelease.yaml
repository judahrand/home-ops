---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
spec:
  chartRef:
    kind: OCIRepository
    name: vikunja
  interval: 1h
  values:
    controllers:
      vikunja:
        forceRename: vikunja
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          main:
            image:
              repository: docker.io/vikunja/vikunja
              tag: 2.7.0
            env:
              VIKUNJA_FILES_BASEPATH: /files
              VIKUNJA_SERVICE_ENABLECALDAV: false
              VIKUNJA_SERVICE_ENABLELINKSHARING: false
              VIKUNJA_SERVICE_ENABLEREGISTRATION: false
              VIKUNJA_SERVICE_PUBLICURL: https://vikunja.judahrand.net/
              VIKUNJA_AUTH_OPENID_ENABLED: "true"
              VIKUNJA_AUTH_OPENID_PROVIDERS_KANIDM_NAME: Kanidm
              VIKUNJA_AUTH_OPENID_PROVIDERS_KANIDM_AUTHURL: https://auth.judahrand.net/oauth2/openid/vikunja
              VIKUNJA_AUTH_OPENID_PROVIDERS_KANIDM_CLIENTID: vikunja
              VIKUNJA_AUTH_OPENID_PROVIDERS_KANIDM_CLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              VIKUNJA_AUTH_OPENID_PROVIDERS_KANIDM_SCOPE: "openid profile email"
              # Link existing local accounts on first OIDC login (both must be set).
              VIKUNJA_AUTH_OPENID_PROVIDERS_KANIDM_USERNAMEFALLBACK: "true"
              VIKUNJA_AUTH_OPENID_PROVIDERS_KANIDM_EMAILFALLBACK: "true"
            envFrom:
              - secretRef:
                  name: vikunja-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 5m
                memory: 192Mi
              limits:
                memory: 1024Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: vikunja
        ports:
          http:
            port: &port 3456

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.judahrand.net"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: vikunja
        advancedMounts:
          vikunja:
            main:
              - path: /files
                subPath: files
