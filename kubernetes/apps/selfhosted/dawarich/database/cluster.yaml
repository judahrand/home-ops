---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-database
spec:
  instances: 2
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202609281634-standard-bookworm@sha256:2257decb7de100886c14262e646a6dc10b70057005dbc7cae4b6693282727e2b
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enablePDB: true

  # Keep the primary and standby on separate nodes so a node restart can fail
  # over to the replica instead of taking the database down entirely.
  affinity:
    podAntiAffinityType: required

  storage:
    size: 10Gi
    storageClass: miroir-slow-local

  superuserSecret:
    name: cloudnative-pg-secret

  enableSuperuserAccess: true

  postgresql:
    extensions:
      - name: postgis
        image:
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.4-18-bookworm@sha256:1cb11a3137a27ddcca617fdacd52434a817f26150a044c3de1af3e27860f68f2
        ld_library_path:
          - system
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  managed:
    roles:
      - name: dawarich
        ensure: present
        login: true
        superuser: false
        inRoles: []
        passwordSecret:
          name: dawarich-database-secret

  resources:
    requests:
      cpu: 20m
      memory: 512Mi
    limits:
      memory: 4Gi

  # PodMonitor is managed explicitly in ./podmonitor.yaml.

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: dawarich-database
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: &currentCluster dawarich-database-v3

  # To restore: uncomment the block below, bump the archiver `serverName` above
  # to the next version, and delete the Cluster together with its PVCs so the
  # operator recreates them and runs the recovery.
  #
  # bootstrap:
  #   recovery:
  #     source: &previousCluster dawarich-database-v2
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: dawarich-database
  #         serverName: *previousCluster
