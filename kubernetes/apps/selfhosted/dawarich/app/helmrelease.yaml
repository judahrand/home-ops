---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dawarich
  values:
    controllers:
      dawarich:
        labels:
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/freikin/dawarich
              tag: 1.12.0@sha256:e66b6742768d0b0d055f031bfc2c1fb87b45389f0564d6503cd654b18389aa0b
            command: ["web-entrypoint.sh"]
            args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
            env: &env
              TZ: Europe/London
              TIME_ZONE: Europe/London
              ALLOW_EMAIL_PASSWORD_REGISTRATION: false
              ALLOW_EMAIL_PASSWORD_LOGIN: true
              APPLICATION_HOSTS: "{{ .Release.Name }}.judahrand.net"
              APPLICATION_PROTOCOL: http
              DISTANCE_UNIT: km
              ENABLE_TELEMETRY: false
              MIN_MINUTES_SPENT_IN_CITY: 60
              RAILS_ENV: production
              RAILS_LOG_TO_STDOUT: true
              SELF_HOSTED: true
              STORE_GEODATA: true
            envFrom: &envFrom
              - secretRef:
                  name: "dawarich-secret"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 3000
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2Gi
          sidekick:
            image:
              repository: docker.io/freikin/dawarich
              tag: 1.12.0@sha256:e66b6742768d0b0d055f031bfc2c1fb87b45389f0564d6503cd654b18389aa0b
            command: ["sidekiq-entrypoint.sh"]
            args: ["sidekiq"]
            env: *env
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.judahrand.net"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          dawarich:
            app: &mounts
              - path: /var/app/public
                subPath: public
              - path: /var/app/storage
                subPath: storage
              - path: /var/app/tmp/imports/watched
                subPath: watched
            sidekick: *mounts
