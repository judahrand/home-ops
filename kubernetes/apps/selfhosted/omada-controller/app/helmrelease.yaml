---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app omada-controller
spec:
  chartRef:
    kind: OCIRepository
    name: omada-controller
  interval: 1h
  values:
    controllers:
      omada-controller:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [
                {"name": "lan", "namespace": "kube-system", "ips": ["10.0.1.30/24"]}
              ]
          terminationGracePeriodSeconds: 60
          securityContext:
            # runAsNonRoot: true
            # runAsUser: 1000
            # runAsGroup: 1000
            fsGroup: 508
            fsGroupChangePolicy: OnRootMismatch
            # seccompProfile:
            #   type: RuntimeDefault
        containers:
          app:
            image:
              repository: mbentley/omada-controller
              tag: 6.3.0.45@sha256:3470f2e34344f8581270e7389ea51338f5893ba034a4b348751b2b288d3bceef
            env:
              TZ: Europe/London
              # ROOTLESS: "true"
              MANAGE_HTTP_PORT: "8088"
              MANAGE_HTTPS_PORT: &https_port "8043"
              PORTAL_HTTP_PORT: "8888"
              PORTAL_HTTPS_PORT: "8843"
              SHOW_SERVER_LOGS: "true"
              SHOW_MONGODB_LOGS: "true"
              # honor envoy X-Forwarded-Proto so the 443 route serves instead of 302 -> :8043
              APPLICATION_PROPERTIES: server.forward-headers-strategy=framework
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8088
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            # securityContext:
            #   allowPrivilegeEscalation: false
            #   readOnlyRootFilesystem: false
            #   capabilities:
            #     drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 1200Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    service:
      app:
        controller: omada-controller
        primary: true
        ports:
          https:
            port: *https_port
      controller:
        controller: omada-controller
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.42.70
        externalTrafficPolicy: Local
        ports:
          # # Docs: https://www.tp-link.com/us/support/faq/3281/
          # Web Management and Portal
          mgmt-8088-tcp:
            port: 8088
            targetPort: 8088
            protocol: TCP
          mgmt-8043-tcp:
            port: 8043
            protocol: TCP
            targetPort: 8043
          portal-8843-tcp:
            port: 8843
            protocol: TCP
            targetPort: 8843
          # Device Discovery, Adoption, Management, and Upgrade
          eap-v5-discovery:
            port: 29810
            protocol: UDP
            targetPort: 29810
          eap-v4-discovery1:
            port: 29811
            protocol: TCP
            targetPort: 29811
          eap-v4-discovery2:
            port: 29812
            protocol: TCP
            targetPort: 29812
          eap-v4-upgrade:
            port: 29813
            protocol: TCP
            targetPort: 29813
          eap-v5-manage:
            port: 29814
            protocol: TCP
            targetPort: 29814
          eap-v5-device-info:
            port: 29815
            protocol: TCP
            targetPort: 29815
          eap-v5-remote-control:
            port: 29816
            protocol: TCP
            targetPort: 29816
          eap-v6-monitoring:
            port: 29817
            protocol: TCP
            targetPort: 29817
          # Initialization Check
          init-check:
            port: 27001
            protocol: UDP
            targetPort: 27001
          # Database Access
          db-access:
            port: 27217
            protocol: TCP
            targetPort: 27217
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.judahrand.net"
          - "omada.judahrand.net"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: https
    persistence:
      certificate:
        type: secret
        name: omada-controller-certificate-secret
        globalMounts:
          - path: /cert
      data:
        existingClaim: *app
        globalMounts:
          - path: /opt/tplink/EAPController/data
      work:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /opt/tplink/EAPController/work
      logs:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /opt/tplink/EAPController/logs
      backup:
        type: nfs
        server: truenas.servers
        path: /mnt/main/omada/backup
        globalMounts:
          - path: /opt/tplink/EAPController/data/autobackup
