---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: obico-ml-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: obico-ml-api
  enableDefaultDeny:
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: bambuddy
            k8s:io.kubernetes.pod.namespace: selfhosted
      toPorts:
        - ports:
            - port: "3333"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3333"
              protocol: TCP
