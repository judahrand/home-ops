[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
JUST_UNSTABLE = "1"
LEFTHOOK_OUTPUT = "false"

_.file = ["{{config_root}}/.secrets.env"]

[settings]
experimental = true
lockfile = true

[hooks]
postinstall = "lefthook install"

[tools]
"python" = "3.14.7"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.0"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "2.24.0"
actionlint = "1.7.12"
jq = "1.8.2"
just = "1.58.0"
lefthook = "2.1.14"
oxfmt = "0.70.0"
shellcheck = "0.11.0"
talos = "1.13.3"
uv = "0.11.18"
yq = "4.53.6"
zizmor = "1.30.1"
